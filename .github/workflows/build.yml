
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find source ZIP
        id: source
        shell: bash
        run: |
          ZIP="$(find "$GITHUB_WORKSPACE" -type f \
            -iname '*GFX*Resolution*Fixer*.zip' \
            -not -path '*/.git/*' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "::error::Source ZIP not found"
            ls -la
            exit 1
          fi

          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o "${{ steps.source.outputs.zip_path }}" -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          SETTINGS="$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle not found"
            exit 1
          fi

          ROOT="$(dirname "$SETTINGS")"
          gradle -p "$ROOT" assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BGMI-GFX-Resolution-Fixer-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
